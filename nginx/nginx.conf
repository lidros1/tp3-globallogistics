events {
    worker_connections 4096;
}

http {
    upstream backend_globallogistics {
        # Apunta al nombre del servicio "api" en docker-compose y aplica Health Check pasivo
        server api:3000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend_globallogistics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Timeouts cortos y reintento automático en otra réplica si una falla (Resiliencia)
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        }

        location /health {
            proxy_pass http://backend_globallogistics/health;
            access_log off;
        }
    }
}